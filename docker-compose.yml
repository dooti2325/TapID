services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tapid}
      MYSQL_USER: ${MYSQL_USER:-tapid_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tapid_password}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
      - ./database/triggers.sql:/docker-entrypoint-initdb.d/04-triggers.sql:ro
      - ./database/procedures.sql:/docker-entrypoint-initdb.d/05-procedures.sql:ro

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=${MYSQL_USER:-tapid_user}
      - DB_PASS=${MYSQL_PASSWORD:-tapid_password}
      - DB_NAME=${MYSQL_DATABASE:-tapid}
      - JWT_SECRET=${TAPID_JWT_SECRET:-change-this-development-secret-32-chars}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - PORT=3000
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
