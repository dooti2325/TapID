; =============================================================================
; PlatformIO Project Configuration for TapID ESP32 Firmware
; =============================================================================

[platformio]
src_dir = esp32
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    bblanchon/ArduinoJson @ ^7.0.4
